[workspace]
resolver = "3"
members = [
    "uikit",
    "examples/*"
]

[workspace.dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "4f02d83989567f9eb0af6382c5f766c43a640f58", default-features = false, features = [
    "wgpu",
    "advanced",
    "canvas",
    "image",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "webgl",
    "fira-sans",
    "tiny-skia",
    "svg"
] }

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Quartix <qntlink@gmail.com>"]
license = "LGPL-2.1"
repository = "https://github.com/sonata-ltd/auravibe"
rust-version = "1.91.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
