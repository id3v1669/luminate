[workspace]
resolver = "3"
members = [
    "uikit",
    "examples/*"
]

[workspace.dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "advanced",
    "canvas",
    "image",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "webgl",
    "fira-sans"
] }

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Quartix <qntlink@gmail.com>"]
license = "LGPL-2.1"
repository = "https://github.com/sonata-ltd/auravibe"
rust-version = "1.91.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
